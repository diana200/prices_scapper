<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
     <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/store_favicon.png') }}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/search">PriceTracker</a>

        <button id="darkModeToggle" class="btn btn-outline-light btn-sm ms-auto">
            Dark Mode
        </button>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
