{% extends "base.html" %}
{% block title %}Set Alert{% endblock %}

{% block content %}

<h2 class="mb-4 text-center">📉 Set Price Alert</h2>

<div class="card">
    <div class="card-body">

        <h4>Product Name: {{ product_name }}</h4>
       <!--  <p class="text-muted">Store: {{ store }}</p> -->

        <form method="POST" action="/alerts">
            <div class="mb-3">
                <label class="form-label">Threshold Price</label>
                <input type="number" step="0.01" name="threshold" class="form-control" placeholder="Enter threshold...">
            </div>

            <input type="hidden" name="product_id" value="{{ product_id }}">
           <!--  <input type="hidden" name="store" value="{{ store }}"> -->

            <button class="btn btn-primary">Save Alert</button>
        </form>

    </div>
</div>

{% endblock %}
